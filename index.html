<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>ZENSEI AR</title>

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image.prod.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; overflow: hidden; font-family: sans-serif; }

  #loading-screen {
    position: fixed; inset: 0; z-index: 9999;
    background: #111;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 20px;
    transition: opacity 0.8s ease;
  }
  #loading-screen.hidden { opacity: 0; pointer-events: none; }

  .ls-logo {
    font-size: 36px; font-weight: 800;
    letter-spacing: 0.15em; color: #fff;
  }
  .ls-logo span { color: #C0392B; }

  .loading-bar-wrap {
    width: 180px; height: 2px;
    background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden;
  }
  .loading-bar {
    height: 100%; width: 0%; background: #C0392B;
    border-radius: 2px;
    animation: loadbar 3s ease forwards;
  }
  @keyframes loadbar { to { width: 100%; } }

  .ls-hint {
    font-size: 11px; color: rgba(255,255,255,0.35);
    letter-spacing: 0.15em; text-transform: uppercase;
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:0.35} 50%{opacity:0.9} }

  #status-bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
    padding: 12px 20px;
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent);
    pointer-events: none;
  }
  .status-logo {
    font-size: 16px; font-weight: 800;
    letter-spacing: 0.15em; color: #fff;
  }
  .status-logo span { color: #C0392B; }
  .status-badge {
    display: flex; align-items: center; gap: 6px;
    font-size: 10px; color: rgba(255,255,255,0.45);
    letter-spacing: 0.12em; text-transform: uppercase;
  }
  .status-dot {
    width: 6px; height: 6px; border-radius: 50%; background: #C0392B;
    animation: blink 2s ease-in-out infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.15} }

  #guide-overlay {
    position: fixed; inset: 0; z-index: 500;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    pointer-events: none;
    transition: opacity 0.5s ease;
  }
  #guide-overlay.hidden { opacity: 0; }

  .finder-frame {
    width: 260px; height: 160px; position: relative;
  }
  .finder-frame::before, .finder-frame::after,
  .fc-br, .fc-bl {
    content: ''; position: absolute;
    width: 36px; height: 36px; border-color: #C0392B; border-style: solid;
  }
  .finder-frame::before { top:0; left:0;  border-width: 2px 0 0 2px; }
  .finder-frame::after  { top:0; right:0; border-width: 2px 2px 0 0; }
  .fc-br { bottom:0; right:0; border-width: 0 2px 2px 0; }
  .fc-bl { bottom:0; left:0;  border-width: 0 0 2px 2px; }

  .scan-line {
    position: absolute; left: 0; right: 0; height: 1px;
    background: linear-gradient(to right, transparent, #C0392B, transparent);
    top: 0; animation: scan 2.5s ease-in-out infinite;
  }
  @keyframes scan { 0%{top:0} 50%{top:100%} 100%{top:0} }

  .guide-text {
    margin-top: 20px; font-size: 11px;
    color: rgba(255,255,255,0.45);
    letter-spacing: 0.15em; text-transform: uppercase; text-align: center;
  }
  .guide-sub {
    margin-top: 8px; font-size: 10px;
    color: rgba(255,255,255,0.25);
    letter-spacing: 0.08em; text-align: center;
  }

  #info-card {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(140px);
    z-index: 900; width: 300px;
    background: rgba(10,10,10,0.93);
    border: 1px solid rgba(192,57,43,0.35);
    border-radius: 14px; padding: 18px 22px;
    backdrop-filter: blur(16px);
    transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    display: none;
  }
  #info-card.visible {
    transform: translateX(-50%) translateY(0);
    display: block;
  }

  .card-brand {
    font-size: 20px; font-weight: 800;
    letter-spacing: 0.15em; color: #fff; margin-bottom: 2px;
  }
  .card-brand span { color: #C0392B; }
  .card-sub {
    font-size: 10px; color: rgba(255,255,255,0.4);
    letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 14px;
  }
  .card-divider { height: 1px; background: rgba(255,255,255,0.07); margin-bottom: 14px; }
  .card-link {
    display: flex; align-items: center; gap: 10px;
    color: rgba(255,255,255,0.55); text-decoration: none;
    font-size: 13px; padding: 5px 0; transition: color 0.2s;
  }
  .card-link:hover { color: #C0392B; }
  .card-icon {
    width: 28px; height: 28px; border-radius: 7px;
    background: rgba(192,57,43,0.15);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; flex-shrink: 0;
  }

  #particle-canvas {
    position: fixed; inset: 0; z-index: 100;
    pointer-events: none;
    opacity: 0; transition: opacity 1s ease;
  }
  #particle-canvas.active { opacity: 1; }
</style>
</head>
<body>

<div id="loading-screen">
  <div class="ls-logo"><span>Z</span>ENSEI</div>
  <div class="loading-bar-wrap"><div class="loading-bar"></div></div>
  <div class="ls-hint">カメラを起動中</div>
</div>

<div id="status-bar">
  <div class="status-logo"><span>Z</span>ENSEI</div>
  <div class="status-badge"><div class="status-dot"></div>AR READY</div>
</div>

<div id="guide-overlay">
  <div class="finder-frame">
    <div class="scan-line"></div>
    <div class="fc-br"></div>
    <div class="fc-bl"></div>
  </div>
  <div class="guide-text">ZENSEIロゴをかざしてください</div>
  <div class="guide-sub">ロゴ全体がフレームに入るように</div>
</div>

<canvas id="particle-canvas"></canvas>

<div id="info-card">
  <div class="card-brand"><span>Z</span>ENSEI</div>
  <div class="card-sub">［部署・役職など］</div>
  <div class="card-divider"></div>
  <a href="https://zensei.example.com" class="card-link">
    <div class="card-icon">🌐</div>zensei.example.com
  </a>
  <a href="mailto:info@zensei.example.com" class="card-link">
    <div class="card-icon">✉️</div>info@zensei.example.com
  </a>
  <a href="tel:0312345678" class="card-link">
    <div class="card-icon">📞</div>03-1234-5678
  </a>
</div>

<!-- MindAR + A-Frame シーン -->
<a-scene
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiError: no; uiScanning: no;"
  color-space="sRGB"
  renderer="colorManagement: true; physicallyCorrectLights: true;"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
>
  <a-assets>
    <img id="zensei-logo" src="./zensei_logo.png" crossorigin="anonymous">
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <!-- targetIndex: 0 = targets.mindの1枚目の画像 -->
  <a-entity mindar-image-target="targetIndex: 0" id="ar-target">

    <!-- 足元プラットフォーム -->
    <a-cylinder
      position="0 0 0"
      radius="0.6" height="0.01"
      color="#C0392B" opacity="0.12"
      animation="property: rotation; from: 0 0 0; to: 0 360 0; dur: 18000; loop: true; easing: linear">
    </a-cylinder>

    <!-- 外リング -->
    <a-torus
      position="0 0.02 0"
      radius="0.58" radius-tubular="0.006"
      color="#C0392B" opacity="0.55"
      animation="property: rotation; from: 0 0 0; to: 0 360 0; dur: 7000; loop: true; easing: linear">
    </a-torus>

    <!-- 内リング（逆回転） -->
    <a-torus
      position="0 0.03 0"
      radius="0.4" radius-tubular="0.004"
      color="#888888" opacity="0.35"
      animation="property: rotation; from: 0 0 0; to: 0 -360 0; dur: 5000; loop: true; easing: linear">
    </a-torus>

    <!-- ZENSEIロゴ：ロゴの上に浮かび上がりY軸回転 -->
    <a-image
      src="#zensei-logo"
      width="1.0" height="0.35"
      position="0 0.5 0"
      animation__spin="property: rotation; from: 0 0 0; to: 0 360 0; dur: 5000; loop: true; easing: linear"
      animation__float="property: position; from: 0 0.4 0; to: 0 0.6 0; dur: 2500; loop: true; dir: alternate; easing: easeInOutSine">
    </a-image>

    <!-- 浮遊ドット -->
    <a-sphere position="-0.5 0.15 0" radius="0.025" color="#C0392B"
      animation="property: position; from: -0.5 0.15 0; to: -0.5 0.35 0; dur: 2000; loop: true; dir: alternate; easing: easeInOutSine">
    </a-sphere>
    <a-sphere position="0.5 0.2 0" radius="0.025" color="#888888"
      animation="property: position; from: 0.5 0.2 0; to: 0.5 0.4 0; dur: 2400; loop: true; dir: alternate; easing: easeInOutSine">
    </a-sphere>
    <a-sphere position="0 0.18 -0.4" radius="0.018" color="#C0392B"
      animation="property: position; from: 0 0.18 -0.4; to: 0 0.38 -0.4; dur: 1900; loop: true; dir: alternate; easing: easeInOutSine">
    </a-sphere>

  </a-entity>
</a-scene>

<script>
window.addEventListener('load', () => {
  setTimeout(() => {
    document.getElementById('loading-screen').classList.add('hidden');
  }, 3200);
});

const guide    = document.getElementById('guide-overlay');
const infoCard = document.getElementById('info-card');
const pCanvas  = document.getElementById('particle-canvas');
const ctx      = pCanvas.getContext('2d');

function resizeCanvas() {
  pCanvas.width  = window.innerWidth;
  pCanvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

let particles = [], animId = null, running = false;

class Particle {
  constructor() { this.reset(); }
  reset() {
    this.x     = Math.random() * pCanvas.width;
    this.y     = pCanvas.height + 10;
    this.vx    = (Math.random() - 0.5) * 0.5;
    this.vy    = -(Math.random() * 1.0 + 0.3);
    this.r     = Math.random() * 2.5 + 0.5;
    this.alpha = Math.random() * 0.5 + 0.15;
    this.color = Math.random() > 0.5 ? '#C0392B' : '#888888';
  }
  update() {
    this.x += this.vx; this.y += this.vy; this.alpha -= 0.003;
    if (this.y < -10 || this.alpha <= 0) this.reset();
  }
  draw() {
    ctx.save();
    ctx.globalAlpha = this.alpha;
    ctx.fillStyle   = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function startParticles() {
  if (running) return;
  running = true;
  for (let i = 0; i < 50; i++) particles.push(new Particle());
  loop();
}
function stopParticles() {
  running = false;
  if (animId) cancelAnimationFrame(animId);
  ctx.clearRect(0, 0, pCanvas.width, pCanvas.height);
  particles = [];
}
function loop() {
  if (!running) return;
  ctx.clearRect(0, 0, pCanvas.width, pCanvas.height);
  particles.forEach(p => { p.update(); p.draw(); });
  animId = requestAnimationFrame(loop);
}

/* MindAR のターゲット検出イベント */
const sceneEl = document.querySelector('a-scene');
sceneEl.addEventListener('arReady', () => {
  document.getElementById('loading-screen').classList.add('hidden');
});

const target = document.getElementById('ar-target');
target.addEventListener('targetFound', () => {
  guide.classList.add('hidden');
  infoCard.style.display = 'block';
  setTimeout(() => infoCard.classList.add('visible'), 10);
  pCanvas.classList.add('active');
  startParticles();
});
target.addEventListener('targetLost', () => {
  guide.classList.remove('hidden');
  infoCard.classList.remove('visible');
  setTimeout(() => { infoCard.style.display = 'none'; }, 500);
  pCanvas.classList.remove('active');
  stopParticles();
});
</script>
</body>
</html>
